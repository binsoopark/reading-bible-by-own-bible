version: 2
updates:
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    groups:
      android-dependencies:
        patterns:
          - "*"
  - package-ecosystem: bundler
    directory: /android
    schedule:
      interval: weekly
  - package-ecosystem: swift
    directory: /ios
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
