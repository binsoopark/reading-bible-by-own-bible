name: Android Release

on:
  workflow_dispatch:
    inputs:
      deploy_to_play:
        description: "Google Play 공개 테스트에 업로드"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: android/**/build.gradle

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: android

      - name: Restore upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/google_play_upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/google_play_upload.jks" >> "$GITHUB_ENV"

      - name: Restore Play Store service account
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_to_play)
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$PLAY_SERVICE_ACCOUNT_JSON"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-store-service-account.json"
          echo "PLAY_STORE_JSON_KEY_PATH=$RUNNER_TEMP/play-store-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy to Play Open Testing (Fastlane)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_to_play)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bundle exec fastlane deploy_open_testing

      - name: Build release only (no Play deploy)
        if: github.event_name == 'workflow_dispatch' && !inputs.deploy_to_play
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bundle exec fastlane build_release

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reading-my-bible-release
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk

      - name: Attach artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          APK="android/app/build/outputs/apk/release/app-release.apk"
          cp "$AAB" "/tmp/reading-my-bible-${VERSION}.aab"
          cp "$APK" "/tmp/reading-my-bible-${VERSION}.apk"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Reading My Bible ${VERSION}" \
              --notes "Google Play 공개 테스트(beta)에 배포되었습니다. AAB/APK는 아래 에셋을 참고하세요."
          fi
          gh release upload "$TAG" \
            "/tmp/reading-my-bible-${VERSION}.aab" \
            "/tmp/reading-my-bible-${VERSION}.apk" \
            --clobber
